# form_url: null shows a "form coming soon" button. deadline must match an id in dates.yml.
- id: call-for-papers
  title: Call for Student Paper Award Competition
  subtitle: Students are invited to submit their methodological research and imaging statistics applications.
  paragraphs:
    - We welcome submissions in both theoretical statistical modeling, applied biostatistical and data-analytic discoveries in imaging, and ML/AI methods and algorithms.
    - The conference provides an excellent platform for students to present their work, receive feedback from peers and mentors, and connect with leading experts in the field of statistical methods in imaging.
  panel_title: Best Paper Competition
  panel_items:
    - { icon: fa-award, text: Best Student Paper Award based on scientific contribution and innovation }
    - { icon: fa-users, text: Peer-review process with domain experts }
  form_label: Best Student Paper Submission Form
  form_url: null
  deadline_label: Best Student Paper Submission Deadline
  deadline: student-papers

- id: call-for-posters
  title: Call for Poster Abstracts
  subtitle: Statistics and imaging researchers are invited to submit abstracts and present posters of their work.
  paragraphs:
    - We welcome poster submissions in theoretical statistical modeling, applied biostatistical inference, and imaging data-analytic discoveries.
    - The conference provides an excellent platform for scholars to present their work and receive feedback from peers in the statistical methods in imaging network.
  panel_title: Poster Submission Form
  panel_items: []
  form_label: Poster Submission Form
  form_url: null
  deadline_label: Poster Submission Deadline
  deadline: posters

- id: call-for-short-courses
  title: Call for Short-Course Proposals
  subtitle: Statistics and imaging researchers are invited to submit short-course proposals.
  paragraphs:
    - We welcome submissions for short-courses in theoretical statistical modeling, applied biostatistical inference, and imaging data-analytics.
    - The conference provides an excellent platform for scholars to show hands-on new protocols, methods, and interactive demonstrations.
  panel_title: Short-Course Submission Form
  panel_items: []
  form_label: Short-Course Submission Form
