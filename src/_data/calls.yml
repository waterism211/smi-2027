# form_url: null shows a "form coming soon" button. deadline must match an id in dates.yml.
- id: call-for-papers
  title: Call for Student Papers
  subtitle: Students can enter their imaging statistics research in the SMI 2027 paper competition.
  paragraphs:
    - We invite students to submit papers on statistical theory, methods, or applications in imaging, including machine learning and AI methods for imaging data.
    - Eligibility rules and award details for 2027 will be posted with the submission form.
  panel_title: Student Paper Competition
  panel_items:
    - { icon: fa-layer-group, text: "Tracks at recent meetings: Theory and Methods; Case Studies and Applications" }
    - { icon: fa-award, text: Recent winners presented their work at the conference }
  form_label: Submit a Student Paper
  form_url: null
  deadline_label: Student Paper Deadline
  deadline: student-papers

- id: call-for-posters
  title: Call for Posters
  subtitle: Share your work at the SMI 2027 poster session.
  paragraphs:
    - We invite poster abstracts on statistical methods for imaging, from new theory and methods to case studies and software.
    - Abstract requirements will be posted with the submission form.
  panel_title: Poster Submission
  panel_items: []
  form_label: Submit a Poster Abstract
  form_url: null
  deadline_label: Poster Abstract Deadline
  deadline: posters

- id: call-for-short-courses
  title: Call for Short Courses
  subtitle: Propose a short course or tutorial for SMI 2027.
  paragraphs:
    - We invite proposals for short courses and tutorials that teach statistical methods, software, or analysis workflows for imaging data.
    - Recent SMI tutorials have covered deep learning and generative AI, spatiotemporal analytics, and neuroimaging software. Proposal requirements will be posted with the submission form.
  panel_title: Short Course Submission
  panel_items: []
  form_label: Submit a Short Course Proposal
  form_url: null
  deadline_label: Short Course Proposal Deadline
  deadline: short-courses
